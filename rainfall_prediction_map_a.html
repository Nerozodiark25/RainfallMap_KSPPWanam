    <script>
    function makeResizableAndDraggable(id) {
        const el = document.getElementById(id);
        if (!el) return;

        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        el.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            if (e.target.classList.contains('resize-handle')) return;
            e = e || window.event;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            el.style.top = (el.offsetTop - pos2) + "px";
            el.style.left = (el.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    window.addEventListener('load', () => {
        makeResizableAndDraggable('legend-real');
        makeResizableAndDraggable('legend-pred');
        var box = document.getElementById('legend-pred');
        var btn = document.getElementById('legend-toggle');
        if (box && window.innerWidth <= 700) box.classList.add('collapsed');
        if (btn && box) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                box.classList.toggle('collapsed');
            });
        }
    });
    </script>
